<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考研题库</title>
  <link rel="stylesheet" href="lib/katex/katex.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>


  <div class="app-layout">

    <div class="sidebar-left">

      <div class="filter-toolbar" id="filterToolbar">
        <div class="filter-label">状态筛选</div>
        <div class="filter-hint">可组合选择</div>
        <button class="filter-btn active" data-filter="all" aria-pressed="true">全部 <span
            class="filter-count"></span><span class="filter-key">Shift+A</span></button>
        <button class="filter-btn" data-filter="proficient" aria-pressed="false">熟练 <span
            class="filter-count"></span><span class="filter-key">Shift+Z</span></button>
        <button class="filter-btn" data-filter="vague" aria-pressed="false">模糊 <span class="filter-count"></span><span
            class="filter-key">Shift+X</span></button>
        <button class="filter-btn" data-filter="wrong" aria-pressed="false">不会 <span class="filter-count"></span><span
            class="filter-key">Shift+C</span></button>
        <button class="filter-btn" data-filter="unmarked" aria-pressed="false">带笔记 <span
            class="filter-count"></span><span class="filter-key">Shift+N</span></button>
      </div>

      <div class="export-section">
        <div class="export-label">导出</div>
        <button id="btnExportVague" class="export-btn btn-export-vague">导出模糊</button>
        <button id="btnExportWrong" class="export-btn btn-export-wrong">导出不会</button>
      </div>

      <button id="btnSolDefault" class="sol-default-btn">解析默认：显示<span class="sol-key">Shift+Space</span></button>

      <button id="btnDashboard" class="sol-default-btn" style="margin-top:8px">全局进度<span class="sol-key">V</span></button>
      <button id="btnWrongBook" class="sol-default-btn" style="margin-top:8px">错题本<span class="sol-key">B</span></button>
      <button id="btnSm2PanelSidebar" class="sol-default-btn" style="margin-top:8px" onclick="toggleSm2Panel()">间隔复习<span class="sol-key">M</span></button>
      <button id="btnShortcutHelp" class="sol-default-btn" style="margin-top:8px">快捷键帮助<span class="sol-key">H</span></button>
      <button id="btnSwitchSubject" class="sol-default-btn" style="margin-top:8px">切换科目<span class="sol-key">G</span></button>

    </div>

    <div class="main-content">

      <div class="chapter-title-bar" id="chapterTitleBar">
        <button class="db-back-btn wb-back-btn" id="btnBackWrongBook" style="display:none">返回错题本</button>
        <button class="db-back-btn wb-back-btn" id="btnBackDashboard" style="display:none">返回总览</button>
        <div class="title-dropdown" id="ddWb">
          <button class="title-trigger" id="trigWb"><span class="title-trigger-text" id="txtWb"></span><span class="title-arrow">▾</span></button>
          <div class="title-panel" id="panelWb"></div>
        </div>
        <div class="title-dropdown" id="ddSubj">
          <button class="title-trigger" id="trigSubj"><span class="title-trigger-text" id="txtSubj"></span><span class="title-arrow">▾</span></button>
          <div class="title-panel" id="panelSubj"></div>
        </div>
        <div class="title-dropdown" id="ddChapter">
          <button class="title-trigger" id="trigChapter"><span class="title-trigger-text" id="txtChapter"></span><span class="title-arrow">▾</span></button>
          <div class="title-panel" id="panelChapter"></div>
        </div>
        <div class="title-dropdown wrongbook-wb-dd" id="ddWbWrongbook" style="display:none">
          <button class="title-trigger wrongbook-wb-trig" id="trigWbWrongbook"><span class="title-trigger-text" id="txtWbWrongbook"></span><span class="title-arrow">▾</span></button>
          <div class="title-panel" id="panelWbWrongbook"></div>
        </div>
        <span class="panel-title" id="panelTitle" style="display:none"></span>
      </div>

      <div class="main-area" id="mainArea">
        <div id="mainAreaContent">
        <div class="mastery-bar">
          <span class="mastery-label">掌握状态</span>
          <button id="btnProficient" class="gel-btn btn-status" data-status="proficient"><span
              class="func-name">熟练</span><span class="key">Z</span></button>
          <button id="btnFamiliar" class="gel-btn btn-status" data-status="familiar"><span
              class="func-name">较熟练</span><span class="key">Z+X</span></button>
          <button id="btnVague" class="gel-btn btn-status" data-status="vague"><span class="func-name">模糊</span><span
              class="key">X</span></button>
          <button id="btnRusty" class="gel-btn btn-status" data-status="rusty"><span class="func-name">困难</span><span
              class="key">X+C</span></button>
          <button id="btnWrong" class="gel-btn btn-status" data-status="wrong"><span class="func-name">不会</span><span
              class="key">C</span></button>
          <span class="nav-sep">|</span>
          <button id="btnQBad" class="gel-btn btn-qbad-toggle"><span class="func-name">题目图不达标</span><span
              class="key">R</span></button>
          <button id="btnSBad" class="gel-btn btn-sbad-toggle"><span class="func-name">解析图不达标</span><span
              class="key">T</span></button>
        </div>
        <div class="sm2-info-bar" id="sm2InfoBar" style="display:none"></div>
        <div class="img-bad-warning" id="qBadWarning">题目图质量不达标</div>
        <div class="q-label" id="qLabel"></div>
        <div class="sub-select-bar" id="subSelectBar" style="display:none"></div>
        <div class="annot-wrapper" id="qAnnotWrap">
          <img id="questionImg" class="question-img" src="" alt="题目">
          <div class="annot-overlay" id="qAnnotOverlay"></div>
        </div>
        <div class="toggle-bar">
          <button id="btnToggle" class="gel-btn btn-toggle"><span class="func-name">隐藏解析</span><span
              class="key">Space</span></button>
        </div>
        <div class="solution-area show" id="solutionArea">
          <div class="img-bad-warning solution-warn" id="sBadWarning">解析图质量不达标</div>
          <div class="solution-imgs" id="solutionImgs"></div>
        </div>

        <div class="notes-section" id="notesSection">
          <div class="notes-header">
            <span class="notes-title">笔记</span>
            <div class="notes-actions">
              <button id="btnNoteEdit">编辑</button>
              <button id="btnNoteSave" class="btn-save" style="display:none">保存</button>
              <button id="btnNoteCancel" style="display:none">取消</button>
              <button id="btnNoteDelete">删除</button>
            </div>
          </div>
          <div class="notes-duo" id="notesDuo" style="display:none">
            <textarea class="notes-textarea" id="notesTextarea" placeholder="支持 Markdown 与 $LaTeX$ 公式，Enter 保存 / Shift+Enter 换行"></textarea>
            <div class="notes-render notes-preview" id="notesPreview"></div>
          </div>
          <div class="notes-render" id="notesRender"></div>
        </div>
        </div><!-- #mainAreaContent -->
        <div class="dashboard-panel" id="dashboardPanel" style="display:none">
          <div class="db-overview" id="dbOverview">
            <div class="db-grid" id="dbGrid"></div>
          </div>
          <div class="db-detail" id="dbDetail" style="display:none">
            <div class="db-detail-title" id="dbDetailTitle"></div>
            <div class="db-subject-grid" id="dbDetailList"></div>
          </div>
        </div>
        <div class="wrongbook-panel" id="wrongBookPanel" style="display:none">
          <div class="db-subject-grid" id="wrongBookGrid"></div>
        </div>
        <div class="sm2-panel" id="sm2Panel" style="display:none">
          <div class="sm2-overview">
            <div class="sm2-stats-row">
              <div class="sm2-stat-card" id="sm2CardDue"><div class="sm2-stat-num">0</div><div class="sm2-stat-label">今日到期</div></div>
              <div class="sm2-stat-card" id="sm2CardOverdue"><div class="sm2-stat-num">0</div><div class="sm2-stat-label">已逾期</div></div>
              <div class="sm2-stat-card" id="sm2CardQueue"><div class="sm2-stat-num">0</div><div class="sm2-stat-label">队列中</div></div>
              <div class="sm2-stat-card" id="sm2CardMastered"><div class="sm2-stat-num">0</div><div class="sm2-stat-label">已掌握</div></div>
            </div>
            <div class="sm2-mode-row">
              <span class="sm2-mode-label">刷题模式</span>
              <label class="sm2-radio"><input type="radio" name="sm2mode" value="sequential" checked> 顺序</label>
              <label class="sm2-radio"><input type="radio" name="sm2mode" value="random"> 随机</label>
              <label class="sm2-radio"><input type="radio" name="sm2mode" value="overdue"> 仅逾期</label>
            </div>
            <button id="btnSm2StartAll" class="gel-btn btn-status proficient">开始全部复习</button>
          </div>
          <div class="sm2-chapters" id="sm2Chapters"></div>
        </div>
      </div>

    </div><!-- .main-content -->

    <div class="sidebar-right">
      <div class="chapter-selector" id="statsBlock">
        <div class="chapter-label">进度</div>
        <div class="stats-panel" id="statsPanel"></div>
      </div>
      <div id="qnavContainer" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.45);margin-top:12px">
        <div class="qnav-label">题号</div>
        <div class="qnav" id="qnav"></div>
      </div>
    </div>

  </div><!-- .app-layout -->

  <!-- 本地离线库：Markdown（marked）+ LaTeX（KaTeX）+ 消毒（DOMPurify）+ 图片标注（marker.js 3） -->
  <script src="lib/dompurify/purify.min.js"></script>
  <script src="lib/marked/marked.umd.min.js"></script>
  <script src="lib/katex/katex.min.js"></script>
  <script src="lib/katex/contrib/auto-render.min.js"></script>
  <script src="lib/markerjs3/markerjs3.umd.js"></script>
  <script src="js/chapters.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

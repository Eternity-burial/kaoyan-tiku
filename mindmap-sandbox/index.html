<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>思维导图沙箱 (Mindmap Sandbox)</title>
  <link rel="stylesheet" href="css/simpleMindMap.min.css">
  <link rel="stylesheet" href="css/sandbox.css">
</head>
<body>
  <!-- 全屏导图挂载容器 -->
  <div id="mindMapContainer"></div>

  <!-- 顶部悬浮控制栏 -->
  <header class="floating-toolbar">
    <div class="toolbar-title">
      <span>思维导图沙箱</span>
      <span class="badge">MVP 独立版</span>
    </div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" id="btnInsertChild" title="插入子节点 (Tab)">
        <span>子节点</span>
        <kbd>Tab</kbd>
      </button>
      <button type="button" class="tool-btn" id="btnInsertSibling" title="插入同级节点 (Enter)">
        <span>同级节点</span>
        <kbd>Enter</kbd>
      </button>
      <button type="button" class="tool-btn" id="btnDeleteNode" title="删除选中节点及其子树 (Delete)">
        <span>删除</span>
        <kbd>Del</kbd>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" id="btnUndo" title="撤销操作 (Ctrl+Z)">
        <span>撤销</span>
        <kbd>Ctrl+Z</kbd>
      </button>
      <button type="button" class="tool-btn" id="btnRedo" title="重做操作 (Ctrl+Y)">
        <span>重做</span>
        <kbd>Ctrl+Y</kbd>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" id="btnResetView" title="重置视口到中心">
        <span>居中</span>
      </button>
      <button type="button" class="tool-btn" id="btnFitView" title="自适应画布大小">
        <span>自适应</span>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" id="btnExportJson" title="导出思维导图数据为 JSON">
        <span>导出</span>
      </button>
      <button type="button" class="tool-btn" id="btnImportJson" title="导入 JSON 思维导图数据">
        <span>导入</span>
      </button>
      <input type="file" id="importFileInput" accept=".json" style="display: none;">
    </div>
  </header>

  <!-- 右下角缩放控制条 -->
  <div class="floating-viewport-bar">
    <button type="button" class="icon-btn" id="btnZoomOut" title="缩小 (Ctrl + 滚轮向下)">-</button>
    <span class="zoom-text" id="zoomLevelText">100%</span>
    <button type="button" class="icon-btn" id="btnZoomIn" title="放大 (Ctrl + 滚轮向上)">+</button>
  </div>

  <!-- 左下角交互指引提示 -->
  <aside class="shortcut-tips-card">
    <div class="shortcut-tips-title">操作指引</div>
    <div>节点拖拽：拖至上下边缘出现蓝线为同级插入；拖至节点中心为成为子级</div>
    <div>画布漫游：按住 Space 配合鼠标左键拖拽，或直接使用鼠标右键拖拽</div>
    <div>就地编辑：双击节点或选中按 Enter 唤起编辑输入框</div>
  </aside>

  <!-- 独立 Vendor 库及逻辑脚本 -->
  <script src="js/vendor/simpleMindMap.umd.min.js"></script>
  <script src="js/default_data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
